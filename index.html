        const STORAGE_KEY = 'sensor_game_state_v1';
        let state = {
            screen: 'start', // 'start', 'playing', 'explanation', 'result'
            currentIndex: 0,
            answers: [] // ユーザーの選択した文字列を保存
        };

        // 配列をシャッフルするユーティリティ関数
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Markdownの強調表示をHTMLのstrongタグに変換
        function formatText(text) {
            if (!text) return '';
            return text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-apple-accent">$1</strong>');
        }

        // MathJaxの再描画
        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise().catch((err) => console.error(err));
            }
        }

        // 状態の保存と読み込み
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                state = JSON.parse(saved);
            }
        }

        // 画面のトランジション
        function navigateTo(renderFunc) {
            const app = document.getElementById('app');
            app.classList.remove('fade-enter-active');
            app.classList.add('fade-enter');
            
            setTimeout(() => {
                app.innerHTML = renderFunc();
                app.classList.remove('fade-enter');
                app.classList.add('fade-enter-active');
                renderMath();
            }, 200); // フェードアウトの時間に合わせる
        }

        // スタート画面のレンダリング
        function getStartScreenHtml() {
            const hasProgress = state.answers.length > 0 && state.screen !== 'result';

                        </p>
                    </div>
                    
                    <button onclick="startGame()" class="w-full sm:w-auto px-8 py-4 bg-apple-accent hover:bg-opacity-90 text-white font-bold rounded-2xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]">

                    </button>
                </div>
            `;
        }

        function startGame() {
            if (state.screen === 'result') {
                state = { screen: 'playing', currentIndex: 0, answers: [] };
            } else {
                state.screen = 'playing';
            }
            saveState();
            navigateTo(getPlayScreenHtml);
        }

        // プレイ画面のレンダリング
        function getPlayScreenHtml() {
            const q = questionsData[state.currentIndex];
            const progressPercent = ((state.currentIndex) / questionsData.length) * 100;
            
            // 選択肢のシャッフル（表示用のみ。正解判定はテキスト一致で行う）
            const shuffledOptions = shuffleArray([...q.options]);

            let optionsHtml = shuffledOptions.map((opt, i) => `

                navigateTo(getResultScreenHtml);

                navigateTo(getPlayScreenHtml);
                window.scrollTo({ top: 0, behavior: 'smooth' });

        }

        // 結果画面のレンダリング
        function getResultScreenHtml() {
            let correctCount = 0;

                        ${detailsHtml}
                    </div>

                    <div class="mt-10 text-center">
                        <button onclick="resetGame()" class="w-full sm:w-auto px-10 py-4 bg-apple-text hover:bg-black text-white font-bold rounded-2xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                            最初からもう一度プレイ
                        </button>
                    </div>
                </div>
            `;
        }

        function resetGame() {
            state = { screen: 'start', currentIndex: 0, answers: [] };
            saveState();
            navigateTo(getStartScreenHtml);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initApp() {
            loadState();
            
            let renderFunc = getStartScreenHtml;
            if (state.screen === 'playing') {
                renderFunc = getPlayScreenHtml;
            } else if (state.screen === 'explanation') {
                renderFunc = getExplanationScreenHtml;
            } else if (state.screen === 'result') {
                renderFunc = getResultScreenHtml;
            }

            const app = document.getElementById('app');
            app.innerHTML = renderFunc();
            renderMath();
        }

        // DOMContentLoadedを待たずに即時実行（スクリプトが下部にあるため）
        initApp();
    </script>
</body>
</html>
