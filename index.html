<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>センサ基礎① - エンジン部門</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #ffffff; /* テーマカラー: ホワイト */
            color: #334155;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent; /* モバイルのタップハイライトを無効化 */
        }
        
        /* 選択肢ボタンのカスタムスタイル */
        .option-btn {
            transition: all 0.2s ease-in-out;
            border: 2px solid #e2e8f0;
            background-color: #ffffff;
            outline: none; /* フォーカスアウトラインを消去 */
        }
        
        /* PC環境等のマウスホバー時のみ色を変える（スマホのタップ残り防止） */
        @media (hover: hover) and (pointer: fine) {
            .option-btn:hover:not(.selected) {
                background-color: #f8fafc;
                border-color: #cbd5e1;
            }
        }
        
        /* 選択された状態 */
        .option-btn.selected {
            background-color: #064e3b; /* アクセント: ディープグリーン */
            color: white;
            border-color: #064e3b;
            box-shadow: 0 4px 6px -1px rgba(6, 78, 59, 0.2), 0 2px 4px -1px rgba(6, 78, 59, 0.1);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        /* ナビゲーションボタン */
        .nav-btn {
            transition: opacity 0.2s;
        }
        
        .nav-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* アニメーション */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-area {
            padding-bottom: 90px; 
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-green': '#064e3b',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col items-center bg-gray-50">

<div id="app" class="w-full max-w-md bg-white min-h-screen shadow-xl relative flex flex-col mx-auto">
    
    <!-- 1. スタート画面 -->
    <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-6 fade-in">
        <!-- タイトル -->
        <h1 class="text-3xl font-bold text-deep-green mb-4 text-center leading-tight">センサ基礎①</h1>
        <p class="text-md font-medium text-gray-700 mb-8 text-center bg-gray-100 py-2 px-4 rounded-lg">エンジン部門</p>
        
        <p class="text-gray-600 mb-8 text-center leading-relaxed">
            全20問の4択問題です。<br>正答率80%以上（16問正解）で合格となります。<br>頑張りましょう！
        </p>
        <button id="start-btn" class="bg-deep-green text-white font-bold py-4 px-12 rounded-full shadow-lg active:scale-95 transition-transform w-full max-w-xs text-lg">
            スタート
        </button>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="quiz-screen" class="hidden flex-1 flex-col content-area">
        <header class="bg-white p-4 border-b sticky top-0 z-10 flex justify-between items-center shadow-sm">
            <span id="question-counter" class="font-bold text-deep-green text-lg"></span>
            <span id="progress-text" class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full"></span>
        </header>

        <main class="p-5 flex-1 flex flex-col">
            <div id="question-text" class="text-[15px] sm:text-base font-medium mb-6 leading-relaxed bg-white border-l-4 border-deep-green p-4 rounded-r-lg shadow-sm text-gray-800">
                <!-- 問題文 -->
            </div>

            <div id="options-container" class="flex flex-col gap-3 mt-2">
                <!-- 選択肢 -->
            </div>
        </main>

        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t p-4 flex justify-between items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
            <button id="prev-btn" class="nav-btn px-6 py-3 text-deep-green font-bold rounded-lg border-2 border-deep-green bg-white disabled:border-gray-300 disabled:text-gray-400 w-[45%]">
                戻る
            </button>
            <button id="next-btn" class="nav-btn px-6 py-3 bg-deep-green text-white font-bold rounded-lg shadow-md disabled:bg-gray-300 w-[45%] border-2 border-transparent">
                次へ
            </button>
        </nav>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-screen" class="hidden flex-1 flex-col pb-10">
        <header id="result-header" class="text-white p-8 text-center shadow-md transition-colors duration-500">
            <h2 class="text-2xl font-bold mb-3">結果発表</h2>
            <div id="score-display" class="text-5xl font-black mb-4 tracking-wider"></div>
            <div id="pass-fail-display" class="text-lg font-bold py-2 px-6 inline-block rounded-full mt-2 shadow-sm bg-white"></div>
        </header>

        <main class="p-5">
            <h3 class="text-xl font-bold border-b-2 border-deep-green pb-2 mb-6 mt-4 text-gray-800">解答と解説</h3>
            <div id="result-list" class="space-y-6">
                <!-- 結果リスト -->
            </div>
            
            <div class="mt-10 text-center">
                <button id="restart-btn" class="bg-white text-deep-green border-2 border-deep-green font-bold py-4 px-8 rounded-full shadow-md active:scale-95 transition-transform w-full max-w-xs text-lg">
                    最初からやり直す
                </button>
            </div>
        </main>
    </div>

</div>

<script>
    // --- 問題データ ---
    const quizData = [
        {
            question: "〔No. 1〕 センサの特性\nセンサの特性に関する記述として、適切なものは次のうちどれか。",
            correctAnswer: "(3) 熱線式エア・フロー・メータに用いられる発熱抵抗体は、吸入空気量が少なく発熱抵抗体の温度が高くなると、抵抗値は大きくなる。",
            incorrectAnswers: [
                "(1) 水温センサに用いられる負特性のサーミスタは、水温が高くなるに従い抵抗値は大きくなる。",
                "(2) バキューム・センサに用いられるシリコン・チップ（ピエゾ効果をもつ素子）は、受ける圧力が変化すると発生する起電力も変化する。",
                "(4) O2センサに用いられるジルコニア素子は、空燃比が大きい（薄い）状態で燃焼したときは素子の排気ガス側と大気側の酸素濃度差が小さいので、約1Vの起電力を発生する。"
            ],
            explanation: "(1) 不適切：負特性サーミスタ（NTC）は、温度が高くなるに従って電気抵抗値が「小さく」なる特性を持っています。\n(2) 不適切：バキューム・センサは、圧力を受けて電気抵抗が変化する「ピエゾ抵抗効果」を利用したものであり、「ピエゾ効果（圧電効果）」ではありません。\n(3) 適切：発熱抵抗体（白金熱線等）は、温度が高くなると抵抗値が大きくなる特性（正の温度係数）を持ちます。吸入空気量が少なくなると冷却効果が減少し、温度が高くなるため抵抗値が大きくなります。\n(4) 不適切：空燃比が小さい（濃い）状態で燃焼したときに酸素濃度差が「大きく」なり約1Vの起電力を発生します。空燃比が大きい（薄い）場合は濃度差が「小さく」なり、約0Vになります。"
        },
        {
            question: "〔No. 2〕 センサ信号の分類と特性\nセンサに関する記述として、不適切なものは次のうちどれか。",
            correctAnswer: "(3) リニア信号センサとは、検出範囲を定めた中での変化の過程を検出するセンサのことで、検出情報の連続変化に対して電圧を連続変化させるリニア形態の電気信号を作っており、ノック・センサがこれに該当する。",
            incorrectAnswers: [
                "(1) 周波数信号センサとは、継続、かつ、規則的に作動している状況の変化を検出するもので、車速センサ、車輪速センサ、クランク角センサ、及びカム角センサなどに用いられている。",
                "(2) センサ信号の異常検知には、ハードウェアで行われる検知方法と、ソフトウェアで行われる検知方法がある。",
                "(4) 論理信号センサ、リニア信号センサ、及び周波数信号センサのいずれにも含まれないセンサには、O2センサがある。"
            ],
            explanation: "(1) 適切：車速やクランク角センサなどは周波数信号センサです。\n(2) 適切：異常検知はハードウェア検知とソフトウェア検知を組み合わせて行われます。\n(3) 不適切：リニア信号センサは水温センサやスロットル・ポジション・センサなどが該当します。ノック・センサはノッキング特有の「振動（周波数）」を検出するものであり、リニア信号センサには該当しません。\n(4) 適切：O2センサは酸素濃度差から起電力を発生させる独自の発電型センサであり、通常の分類には含まれません。"
        },
        {
            question: "〔No. 3〕 ジルコニア式O2センサの構造・原理\nO2センサに関する記述として、適切なものは次のうちどれか。",
            correctAnswer: "(1) O2センサに使用されているジルコニア素子は、一定以上の高温になったとき、大気側と排気ガス側の酸素濃度差により起電力が発生する性質がある。",
            incorrectAnswers: [
                "(2) O2センサの起電力は、排気ガス中の酸素濃度が高い場合は大きく、低い場合は小さくなる。",

            explanation: "(1) 適切：ジルコニア式O2センサは高温（約300℃以上）で活性化し、酸素濃度差によって起電力を発生します。\n(2) 不適切：排気ガス中の酸素濃度が高い（薄い）と起電力は「小さく」なります。低い（濃い）と起電力は「大きく」なります。\n(3) 不適切：高負荷時は空燃比が小さく（リッチに）なります。このとき排気ガス中の酸素濃度は減少し濃度差が大きくなるため、起電力は「大きく」なります。\n(4) 不適切：ヒータは「ジルコニア素子自体」を加熱して活性温度に保つためのものであり、排気ガスの温度そのものを上昇させるわけではありません。"

            correctAnswer: "(2) ノック・センサは、センサ・ボデーに固定されている振動板に5V安定化電源を加えることで、振動板上の圧電素子に圧力（エンジン全般の振動成分）に応じた起電力を発生し、ノッキングによる振動を検出する。",

                "(3) バキューム・センサは、半導体チップにひずみを与えることで、抵抗値が変化するピエゾ抵抗効果を利用したもので、圧力値を検出する。",
                "(4) O2センサに用いられる円筒状のジルコニア素子は、内外面に白金がコーティングされており、活性化領域を超えたとき、大気側と排気ガス側の酸素濃度差により、起電力を発生させる性質がある。"

        {
            question: "〔No. 5〕 各種センサの構造・点検（絶対圧・熱線式等）\nセンサに関する記述として、不適切なものは次のうちどれか。",
            correctAnswer: "(3) 絶対圧検出型のバキューム・センサ（圧力センサ）は、基準室に大気圧を用いており、インテーク・マニホールド内に発生した圧力をシリコン・チップに作用させ、シリコン・チップの電気抵抗の変化を電圧の変化に置き換えてセンサ信号電圧としている。",
            incorrectAnswers: [
                "(1) ノック・センサ内の振動板上には圧電素子が組み付けられており、一方の電極は出力ターミナルに、他方の電極はノック・センサ・ボデーに接続されている。",
                "(2) ジルコニア素子を用いたO2センサは、円筒状のジルコニア素子の内外面に白金をコーティングしており、内側は大気と、外側は排気ガスと接触できるようになっている。",
                "(4) 熱線式エア・フロー・メータに用いられる発熱抵抗体において、吸入空気量が多いほど、発熱抵抗体の放熱が多く、抵抗が小さいために回路の電流は多くなる。"
            ],
            explanation: "(3) 不適切：絶対圧検出型バキューム・センサは、シリコン・チップの片側に「高度な真空（基準真空室）」を設けています。基準室に「大気圧」を用いるのは、相対圧力（ゲージ圧）検出型です。"
        },
        {

            correctAnswer: "(3) 電子制御装置を作動させておくために必要なクランキング時のバッテリ端子電圧の下限値は、約8Vである。",
            incorrectAnswers: [

            correctAnswer: "(3) 通常走行時の減速時には、エンジンECUはスロットル・バルブ開度の変化（減少）量と吸気圧の変化量を検出して、基本噴射パルス幅を増大させる。",

            explanation: "(3) 不適切：減速時（アクセル全閉・エンジンブレーキ状態）には、基本噴射パルス幅を「減少」させるか、燃料供給を一時停止する「フューエルカット」制御を行います。増大させるわけではありません。"

            correctAnswer: "(1) 中負荷時の均質リーン燃焼時には、吸入行程前期の大気圧以下の雰囲気下で、高圧スワール・インジェクタより燃料をシリンダ内に噴射しており、燃料はシリンダ内に均等に拡散するようになっている。",

            explanation: "(1) 適切：中負荷時の均質リーン燃焼では、吸入行程に噴射して均等に拡散させます。\n(2) 不適切：高負荷時の「均質燃焼」では、燃料は「吸入行程」に噴射されます。\n(3) 不適切：成層燃焼は、プラグ周辺の「濃い部分から着火させ」、全体に燃焼を広げる手法です。\n(4) 不適切：成層燃焼を行う低負荷時は、「圧縮行程（後期）」に噴射します。"

    // --- 状態管理 ---
    let currentQuestionIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null); 
    let shuffledOptionsCache = new Array(quizData.length).fill(null);
    let hasStarted = false; // クイズ開始フラグ

    // --- DOM要素の取得 ---
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    
    const startBtn = document.getElementById('start-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');

    const questionCounter = document.getElementById('question-counter');
    const progressText = document.getElementById('progress-text');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');

    const resultHeader = document.getElementById('result-header');
    const scoreDisplay = document.getElementById('score-display');
    const passFailDisplay = document.getElementById('pass-fail-display');
    const resultList = document.getElementById('result-list');

    // --- 関数定義 ---

    // 配列のシャッフル
    function shuffleArray(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    // 初期化
    function initApp() {
        currentQuestionIndex = 0;
        userAnswers = new Array(quizData.length).fill(null);
        shuffledOptionsCache = new Array(quizData.length).fill(null);
        hasStarted = false;
        
        startScreen.classList.remove('hidden');
        quizScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        window.scrollTo(0, 0);
    }

    // クイズ開始
    function startQuiz() {
        startScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        hasStarted = true;
        
        quizScreen.classList.remove('fade-in');
        void quizScreen.offsetWidth;
        quizScreen.classList.add('fade-in');
        
        loadQuestion();
    }

    // 問題の読み込み
    function loadQuestion() {
        const currentData = quizData[currentQuestionIndex];
        
        questionCounter.textContent = `第 ${currentQuestionIndex + 1} 問`;
        progressText.textContent = `${currentQuestionIndex + 1} / ${quizData.length}`;
        
        questionText.innerHTML = currentData.question.replace(/\n/g, '<br>');

        optionsContainer.innerHTML = '';
        
        if (!shuffledOptionsCache[currentQuestionIndex]) {
            const allOptions = [currentData.correctAnswer, ...currentData.incorrectAnswers];
            shuffledOptionsCache[currentQuestionIndex] = shuffleArray(allOptions);
        }
        
        const options = shuffledOptionsCache[currentQuestionIndex];

        options.forEach(optionText => {
            const button = document.createElement('button');
            button.className = 'option-btn w-full text-left px-5 py-4 rounded-xl text-sm sm:text-base font-medium text-gray-700 shadow-sm';
            button.innerHTML = optionText.replace(/\n/g, '<br>'); 
            
            if (userAnswers[currentQuestionIndex] === optionText) {
                button.classList.add('selected');
            }

            button.addEventListener('click', () => selectOption(button, optionText));
            optionsContainer.appendChild(button);
        });

        updateNavButtons();
        window.scrollTo(0, 0);
    }

    // 選択肢クリック時の処理
    function selectOption(selectedBtn, optionText) {
        const buttons = optionsContainer.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.classList.remove('selected'));

        selectedBtn.classList.add('selected');
        
        // ★重要: タップ後にフォーカスを外すことで、次の問題でホバー状態が引き継がれるのを防ぐ
        selectedBtn.blur();

        userAnswers[currentQuestionIndex] = optionText;
        updateNavButtons();
    }

    // ナビボタン状態更新
    function updateNavButtons() {
        prevBtn.disabled = currentQuestionIndex === 0;

        const hasAnswered = userAnswers[currentQuestionIndex] !== null;
        nextBtn.disabled = !hasAnswered;
        
        if (currentQuestionIndex === quizData.length - 1) {
            nextBtn.textContent = '結果を見る';
            nextBtn.classList.add('bg-orange-600'); 
            nextBtn.classList.remove('bg-deep-green');
        } else {
            nextBtn.textContent = '次へ';
            nextBtn.classList.remove('bg-orange-600');
            nextBtn.classList.add('bg-deep-green');
        }
    }

    // 次へ
    function goNext() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
            optionsContainer.classList.remove('fade-in');
            void optionsContainer.offsetWidth;
            optionsContainer.classList.add('fade-in');
        } else {
            showResult();
        }
    }

    // 戻る
    function goPrev() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
            optionsContainer.classList.remove('fade-in');
            void optionsContainer.offsetWidth;
            optionsContainer.classList.add('fade-in');
        }
    }

    // 結果表示
    function showResult() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        
        resultScreen.classList.remove('fade-in');
        void resultScreen.offsetWidth;
        resultScreen.classList.add('fade-in');
        window.scrollTo(0, 0);

        let correctCount = 0;
        resultList.innerHTML = ''; 

        quizData.forEach((data, index) => {
            const userAnswer = userAnswers[index];
            const isCorrect = userAnswer === data.correctAnswer;
            if (isCorrect) correctCount++;

            // 間違えた問題のみ表示するかどうか（要望：「最後の結果で間違えた問題とその答えと解説を記載」）
            // ※今回は仕様上、正解した問題も振り返れるようにしつつ、表示上分かりやすくします。
            const resultItem = document.createElement('div');
            resultItem.className = `p-5 rounded-xl border-t-4 shadow-md bg-white ${isCorrect ? 'border-green-500' : 'border-red-500'}`;
            
            const badgeClass = isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
            const badgeText = isCorrect ? '正解' : '不正解';
            
            resultItem.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <span class="font-bold text-gray-700 text-lg">Q${index + 1}.</span>
                    <span class="text-sm font-bold px-3 py-1 rounded-full ${badgeClass}">${badgeText}</span>
                </div>
                <div class="text-gray-800 font-medium mb-5 text-[15px] leading-relaxed border-b border-gray-100 pb-3">${data.question.replace(/\n/g, '<br>')}</div>
                
                <div class="space-y-3 text-sm mb-5">
                    <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-3">
                        <span class="text-gray-500 font-bold shrink-0 min-w-[70px]">あなたの回答:</span>
                        <span class="font-medium ${isCorrect ? 'text-green-700' : 'text-red-600 line-through'}">${userAnswer ? userAnswer.replace(/\n/g, '<br>') : '未回答'}</span>
                    </div>
                    ${!isCorrect ? `
                    <div class="flex flex-col sm:flex-row sm:items-start gap-1 sm:gap-3 bg-green-50 p-2 rounded">
                        <span class="text-green-800 font-bold shrink-0 min-w-[70px]">正解:</span>
                        <span class="text-green-800 font-medium">${data.correctAnswer.replace(/\n/g, '<br>')}</span>
                    </div>
                    ` : ''}
                </div>
                
                <div class="bg-gray-50 border border-gray-200 p-4 rounded-lg text-sm text-gray-700 leading-relaxed">
                    <div class="font-bold text-deep-green mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        解説
                    </div>
                    ${data.explanation.replace(/\n/g, '<br>')}
                </div>
            `;
            resultList.appendChild(resultItem);
        });

        // 8割以上(16問以上)で合格
        const requiredScore = Math.ceil(quizData.length * 0.8);
        const passed = correctCount >= requiredScore;
        
        scoreDisplay.textContent = `${correctCount} / ${quizData.length}`;
        
        if (passed) {
            passFailDisplay.textContent = '合格！おめでとうございます！';
            passFailDisplay.className = 'text-xl font-bold py-2 px-6 inline-block rounded-full mt-2 bg-white text-green-600 shadow-lg';
            resultHeader.classList.remove('bg-red-600');
            resultHeader.classList.add('bg-deep-green');
        } else {
            passFailDisplay.textContent = '不合格...もう一度挑戦！';
            passFailDisplay.className = 'text-xl font-bold py-2 px-6 inline-block rounded-full mt-2 bg-white text-red-600 shadow-lg';
            resultHeader.classList.remove('bg-deep-green');
            resultHeader.classList.add('bg-red-600');
        }
    }

    // --- イベントリスナー ---
    startBtn.addEventListener('click', startQuiz);
    nextBtn.addEventListener('click', goNext);
    prevBtn.addEventListener('click', goPrev);
    restartBtn.addEventListener('click', initApp);

    // 起動時
    initApp();

</script>
</body>
</html>
