                question: "センサの特性に関する記述として、適切なものは次のうちどれか。",

                    "(4) O2センサに用いられるジルコニア素子は、空燃比が大きい（薄い）状態で燃焼したときは素子の排気ガス側と大気側の酸素濃度差が小さいので、約1Vの起電力を発生する。"
                ],
                explanation: "* (1) 不適切：水温センサに用いられる負特性サーミスタ（NTC）は、温度（水温）が高くなるに従って電気抵抗値が「小さく」なる特性を持っています。\n* (2) 不適切：バキューム・センサ（吸気管圧力センサ）は、圧力を受けて電気抵抗が変化する「ピエゾ抵抗効果」を利用したものであり、起電力が発生する「ピエゾ効果（圧電効果）」ではありません。\n* (3) 適切：熱線式エア・フロー・メータの発熱抵抗体（白金熱線等）は、温度が高くなると抵抗値が大きくなる特性（正の温度係数）を持ちます。吸入空気量が少なくなると、空気による冷却効果が減少し、抵抗体温度が高くなるため抵抗値が大きくなります。\n* (4) 不適切：ジルコニア素子を用いたO2センサは、空燃比が小さい（濃い、リッチ）状態で燃焼したときに酸素濃度差が「大きく」なり、約1Vの起電力を発生します。空燃比が大きい（薄い、リーン）状態では濃度差が「小さく」なるため、起電力はほぼ0V（約0.1V以下）になります。"
            },
            {
                title: "〔No. 2〕 センサ信号の分類と特性",
                question: "センサに関する記述として、不適切なものは次のうちどれか。",
                correct: "(3) リニア信号センサとは、検出範囲を定めた中での変化の過程を検出するセンサのことで、検出情報の連続変化に対して電圧を連続変化させるリニア形態の電気信号を作っており、ノック・センサがこれに該当する。",
                incorrect: [
                    "(1) 周波数信号センサとは、継続、かつ、規則的に作動している状況の変化を検出するもので、車速センサ、車輪速センサ、クランク角センサ、及びカム角センサなどに用いられている。",
                    "(2) センサ信号の異常検知には、ハードウェア（回路構成 of 仕組みと一部マイコンのプログラムを活用）で行われる検知方法と、ソフトウェア（ハードウェアでは検知できない領域をプログラムにより実施）で行われる検知方法がある。",

                ],
                explanation: "* (1) 適切：周波数信号センサは、回転速度や移動速度をパルス（周波数）として検知するもので、車速、車輪速、クランク角、カム角などのセンサが該当します。\n* (2) 適切：センサ信号の断線・短絡などの異常検知は、プルアップ/プルダウン抵抗等を用いるハードウェア検知と、一定時間内の異常な信号挙動をプログラムで監視するソフトウェア検知を組み合わせて行われます。\n* (3) 不適切：リニア信号センサは、水温センサやスロットル・ポジション・センサ、バキューム・センサなど、位置や状態を連続的な電圧変化で検出するものです。ノック・センサはノッキング特有の「振動（周波数）」を検出するものであり、リニア信号センサには該当しません（自己発電型の非リニア特性を持ちます）。\n* (4) 適切：O2センサは、空燃比の濃淡（リッチ・リーン）による酸素濃度差から起電力を発生させる独自の発電型センサであり、通常の論理・リニア・周波数のいずれの分類にも含まれない特有のセンサに位置づけられます。"

            {

            },
            {
                title: "〔No. 5〕 各種センサの構造・点検（絶対圧・熱線式等）",
                question: "センサに関する記述として、不適切なものは次のうちどれか。",
                correct: "(3) 絶対圧検出型のバキューム・センサ（圧力センサ）は、基準室に大気圧を用いており、インテーク・マニホールド内に発生した圧力をシリコン・チップ（ピエゾ抵抗効果素子）に作用させ、シリコン・チップの電気抵抗の変化を電圧の変化に置き換えてセンサ信号電圧としている。",

                    "(2) ジルコニア素子を用いたO2センサは、円筒状のジルコニア素子の内外面に白金をコーティングしており、内側は大気と、外側は排気ガスと接触できるようになっている。ジルコニア素子は、活性化領域を超えたとき、大気側と排気ガス側の酸素濃度差により、起電力を発生させる性質がある。",
                    "(4) 熱線式エア・フロー・メータに用いられる発熱抵抗体において、吸入空気量が多いほど、発熱抵抗体の放熱が多く、抵抗が小さいために回路（発熱抵抗体）の電流は多くなり、この電流の変化を電圧の変化に置き換えて吸入空気量信号としている。"
                ],
                explanation: "* (1) 適切：ノック・センサは、ブロックから伝わるノッキング振動によって圧電素子が振動して発電し、一方の電極からECUへ信号を送り、もう一方の電極（アース線またはボデー）からグランドへ落とします。\n* (2) 適切：ジルコニア素子は内側が基準大気、外側が排気ガスに触れるようになっており、両室の酸素濃度差を利用して発電します。\n* (3) 不適切：インテーク・マニホールド内の「絶対圧力（真空をゼロとする圧力）」を検出する絶対圧検出型バキューム・センサは、シリコン・チップの片側に「高度な真空（基準真空室）」を設けています。基準室に「大気圧」を用いるのは、相対圧力（ゲージ圧）検出型です。\n* (4) 適切：熱線式（ホットワイヤ・ホットフィルム等）は、吸入空気量が増えるほど発熱抵抗体からの放熱が激しくなるため、温度を一定に保つよう制御回路が多くの加熱電流を流します。この電流量の変化を電圧（出力信号電圧）に変換して測定します。"

            {
                title: "〔No. 6〕 エンジンECUの安定化電源回路",

                correct: "(3) 電子制御装置を作動させておくために必要なクランキング時のバッテリ端子電圧の下限値は、約8Vである。",
                incorrect: [
                    "(1) 5V定電圧回路で作られた基準電圧は、エンジンECU内の駆動回路、センサ入力回路及びマイコン回路の電源として使用される。",
                    "(2) 5V定電圧回路で作られた基準電圧は、クランキングをしたときに 5V±0.25V の範囲であれば変動していても良い。",
                    "(4) アクチュエータに加わる12V電圧は、エンジンECU内の定電圧回路によって 12V 一定に保たれている。"
                ],
                explanation: "* (1) 不適切：ECU内部の5V定電圧（安定化電源）回路で作られた基準電圧は、マイコン、センサ入力回路（センサへの供給電源およびプルアップ電圧）などに使用されますが、大電流を必要とするインジェクタやソレノイドなどの「駆動回路（アクチュエータ用）」にはバッテリ電圧（12V）がそのまま使われます。\n* (2) 不適切：5V定電圧回路は、バッテリ電圧が変動（クランキング時の電圧低下など）しても、常にきめて正確な5V一定を維持するよう設計されています。±0.25Vのように大きく変動してよいわけではありません。\n* (3) 適切：エンジンECUがクランキング時に安定して再起動・作動を維持するためには、バッテリの端子電圧が「約8V以上（一般的に7.5V〜8.0V以上）」確保されている必要があります。バッテリ劣化などでこれ以下に電圧が落ちると、5V定電圧を維持できずECUがリセットされ、エンジンが始動できなくなります。\n* (4) 不適切：インジェクタなどの各種アクチュエータに加わる12V（B+パワー）は、バッテリまたはオルタネータからの発生電圧がリレーを介して直接（無制御で）加わっており、ECU内部の定電圧回路で制御されているわけではありません。"

            {
                title: "〔No. 7〕 Dジェトロニックの空燃比制御",

                    "(2) エンジンが冷間時アイドル回転速度条件から温間時アイドル回転速度条件に移ると、エンジンECUはO2センサからの信号を加えて、理論空燃比付近の非常に狭い範囲の空燃比に制御する。",

                ],
                explanation: "* (1) 適切：冷間時アイドル状態（暖機中）は、O2センサが低温で活性化しておらず、かつ濃い混合気を必要とするため、O2センサ信号を無視したオープンループ制御を行います。水温やマニホールド圧（吸気圧）等から適切な増量を決定します。\n* (2) 適切：暖機が完了し温間アイドル状態へ移行すると、活性化したO2センサの電圧信号（リッチ・リーン情報）に基づき、三元触媒が最も効率よく機能する「理論空燃比」に収まるよう、フィードバック制御（クローズドループ制御）を行います。\n* (3) 不適切：通常走行時の減速時（アクセル全閉・エンジンブレーキ状態）には、吸気管圧力が大きく低下し、スロットル開度が減少したことを検出して、基本噴射パルス幅を「減少」させるか、あるいは燃料の供給を一時的に完全に停止する「フューエルカット（燃料遮断）」制御を行います。\n* (4) 適切：アクセルを急激に踏み込む加速時には、マニホールド圧の上昇に伴う吸入空気の過渡的な遅れを補正するため、スロットル開度等の変化速度・変化量に応じて、基本噴射量とは別に「加速増量補正」を行い、レスポンスの低下を防ぎます。"
            },
            {
                title: "〔No. 8〕 筒内噴射式ガソリン・エンジンの燃焼制御",
                question: "電子制御スロットル装置を用いた層状吸気・超希薄燃焼の筒内噴射式ガソリン・エンジンに関する記述として、適切なものは次のうちどれか。",
                correct: "(1) 中負荷時の均質リーン燃焼時には、吸入行程前期の大気圧以下の雰囲気下で、高圧スワール・インジェクタより燃料をシリンダ内に噴射しており、噴射された燃料は、中空のコーン形状に広がると共にピストンの下降に伴う空気流動により、シリンダ内に均等に拡散するようになっている。",
                incorrect: [
                    "(2) 高負荷時には、圧縮行程後期 高圧雰囲気下で燃料をシリンダ内に噴射し、燃料の気化熱を吸入空気の冷却に利用して体積効率を上げ、理論空燃比近くで均質燃焼を行い、高出力を得ている。",
                    "(3) 成層燃焼とは、層状燃焼と同義であり、部分的に濃淡の混合気の層を作り出して、薄い部分から燃焼させるようにした燃焼方法をいう。",

                                    {isPassed ? '合 格！' : '不 合 格'}
                                </div>
                                <p className="mt-5 text-gray-600 font-medium">合格ライン: {passThreshold}問正解 (80%)</p>
                                
                                <button
                                    onClick={resetGame}
                                    className="mt-8 bg-gray-800 text-white font-bold py-3 px-8 rounded-xl shadow hover:bg-gray-700 active:scale-95 transition"
                                >
                                    もう一度挑戦する
                                </button>
                            </div>

                            <h3 className="text-xl font-bold text-gray-800 mb-6 ml-2 border-l-4 border-deep-green pl-3">全問題の解答と解説</h3>
                            
                            {/* 各問題のレビューリスト */}
                            <div className="space-y-6">
                                {resultDetails.map((ans, idx) => (
                                    <div key={idx} className={"bg-white p-5 sm:p-6 rounded-xl shadow-sm border-l-8 " + (ans.isCorrect ? "border-l-green-500" : "border-l-red-500")}>
                                        <div className="flex items-start justify-between mb-3">
                                            <h4 className="font-bold text-lg text-gray-800">{ans.title}</h4>
                                            {ans.isCorrect ? (
                                                <span className="flex items-center text-green-600 font-bold bg-green-50 px-3 py-1 rounded-full text-sm shrink-0 ml-2">
                                                    <CheckIcon className="w-5 h-5 mr-1" /> 正解
                                                </span>
                                            ) : (
                                                <span className="flex items-center text-red-600 font-bold bg-red-50 px-3 py-1 rounded-full text-sm shrink-0 ml-2">
                                                    <XIcon className="w-5 h-5 mr-1" /> 不正解
                                                </span>
                                            )}
                                        </div>
                                        
                                        <p className="text-gray-700 mb-5 whitespace-pre-wrap bg-gray-50 p-4 rounded-lg text-sm border">{ans.question}</p>
                                        
                                        {/* 回答の比較表示 */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                                            <div className={"p-4 rounded-lg border " + (ans.isCorrect ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200")}>
                                                <div className="text-xs font-bold text-gray-500 mb-1">あなたの回答</div>
                                                <div className={"text-sm font-medium leading-relaxed " + (ans.isCorrect ? "text-green-800" : "text-red-800")}>
                                                    {ans.selected}
                                                </div>
                                            </div>
                                            
                                            {!ans.isCorrect && (
                                                <div className="p-4 rounded-lg border bg-blue-50 border-blue-200">
                                                    <div className="text-xs font-bold text-gray-500 mb-1">正解</div>
                                                    <div className="text-sm font-medium leading-relaxed text-blue-800">
                                                        {ans.cleanCorrect}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        
                                        {/* 解説 */}
                                        <div className="bg-gray-100 p-4 rounded-lg border border-gray-200">
                                            <div className="flex items-center mb-2">
                                                <span className="bg-gray-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">解説</span>
                                            </div>
                                            <p className="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap">{ans.explanation}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="text-center mt-12 pb-12">
                                <button
                                    onClick={resetGame}
                                    className="bg-deep-green text-white font-bold py-4 px-12 rounded-xl shadow-lg hover:bg-deep-green-light active:scale-95 transition"
                                >
                                    トップへ戻る
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
