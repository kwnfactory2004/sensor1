                                    <span className="text-gray-600 text-3xl">{questions.length}</span>
                                </div>
                                <div className={`inline-block px-8 py-3 rounded-full text-2xl font-bold text-white shadow-md ${isPassed ? 'bg-deep-green' : 'bg-red-500'}`}>
                                    {isPassed ? '合 格！' : '不 合 格'}
                                </div>
                                <p className="mt-4 text-gray-600 font-medium">合格ライン: 16問正解 (80%)</p>
                                
                                <button 
                                    onClick={resetGame}
                                    className="mt-8 bg-gray-800 text-white font-bold py-3 px-8 rounded-xl shadow hover:bg-gray-700 transition"
                                >
                                    もう一度挑戦する
                                </button>
                            </div>

                            <h3 className="text-xl font-bold text-gray-800 mb-4 ml-2 border-l-4 border-deep-green pl-3">全問題の解答と解説</h3>
                            
                            {/* 各問題のレビューリスト */}
                            <div className="space-y-6">
                                {answers.map((ans, idx) => (
                                    <div key={idx} className={`bg-white p-5 sm:p-6 rounded-xl shadow-sm border-l-8 ${ans.isCorrect ? 'border-l-green-500' : 'border-l-red-500'}`}>
                                        
                                        <div className="flex items-start justify-between mb-3">
                                            <h4 className="font-bold text-lg text-gray-800">{ans.questionTitle}</h4>
                                            {ans.isCorrect ? (
                                                <span className="flex items-center text-green-600 font-bold bg-green-50 px-3 py-1 rounded-full text-sm">
                                                    <CheckIcon className="w-5 h-5 mr-1" /> 正解
                                                </span>
                                            ) : (
                                                <span className="flex items-center text-red-600 font-bold bg-red-50 px-3 py-1 rounded-full text-sm">
                                                    <XIcon className="w-5 h-5 mr-1" /> 不正解
                                                </span>
                                            )}
                                        </div>
                                        
                                        <p className="text-gray-700 mb-5 whitespace-pre-wrap bg-gray-50 p-4 rounded-lg text-sm border">{ans.questionText}</p>
                                        
                                        {/* 回答の比較表示 */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                                            <div className={`p-4 rounded-lg border ${ans.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                                <div className="text-xs font-bold text-gray-500 mb-1">あなたの回答</div>
                                                <div className={`text-sm ${ans.isCorrect ? 'text-green-800' : 'text-red-800'}`}>
                                                    {ans.selected}
                                                </div>
                                            </div>
                                            
                                            {!ans.isCorrect && (
                                                <div className="p-4 rounded-lg border bg-blue-50 border-blue-200">
                                                    <div className="text-xs font-bold text-gray-500 mb-1">正解</div>
                                                    <div className="text-sm text-blue-800">
                                                        {ans.correct}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* 解説 */}
                                        <div className="bg-gray-100 p-4 rounded-lg border border-gray-200">
                                            <div className="flex items-center mb-2">
                                                <span className="bg-gray-600 text-white text-xs font-bold px-2 py-1 rounded mr-2">解説</span>
                                            </div>
                                            <p className="text-gray-700 text-sm leading-relaxed">{ans.explanation}</p>
                                        </div>

                                    </div>
                                ))}
                            </div>
                            
                            <div className="text-center mt-8 pb-12">
                                <button 
                                    onClick={resetGame}
                                    className="bg-deep-green text-white font-bold py-4 px-12 rounded-xl shadow-lg hover:bg-deep-green-light transition"
                                >
                                    トップへ戻る
                                </button>
                            </div>

                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
